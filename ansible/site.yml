---
- name: Configure Tic Tac Toe server
  hosts: all
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/tic-tac-toe
    app_port: 3000
    node_version: "20"

  tasks:
    # ── Wait for SSH ───────────────────────────────────────────────────────────
    - name: Wait for SSH to be ready
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120

    # ── System packages ────────────────────────────────────────────────────────
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      retries: 5
      delay: 10
      register: apt_result
      until: apt_result is succeeded

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - nginx
        state: present

    # ── Node.js 20 via NodeSource ──────────────────────────────────────────────
    - name: Check if NodeSource repo is already set up
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/nodesource.list
      register: nodesource_list

    - name: Download NodeSource setup script
      ansible.builtin.get_url:
        url: "https://deb.nodesource.com/setup_{{ node_version }}.x"
        dest: /tmp/nodesource_setup.sh
        mode: "0755"
      when: not nodesource_list.stat.exists

    - name: Run NodeSource setup script
      ansible.builtin.command: bash /tmp/nodesource_setup.sh
      when: not nodesource_list.stat.exists
      changed_when: true

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

    # ── App user & directory ───────────────────────────────────────────────────
    - name: Create app user
      ansible.builtin.user:
        name: appuser
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # ── Deploy application code ────────────────────────────────────────────────
    - name: Copy application files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ app_dir }}/{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - { src: "../package.json", dest: "package.json" }
        - { src: "../server.js",    dest: "server.js" }
        - { src: "../src/",         dest: "src/" }
        - { src: "../public/",      dest: "public/" }

    - name: Install Node.js dependencies
      ansible.builtin.command:
        cmd: npm install --omit=dev
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Set app directory ownership to appuser
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: appuser
        group: appuser
        recurse: true

    # ── Systemd service ────────────────────────────────────────────────────────
    - name: Write systemd unit file
      ansible.builtin.copy:
        dest: /etc/systemd/system/tic-tac-toe.service
        mode: "0644"
        content: |
          [Unit]
          Description=Tic Tac Toe Node.js App
          After=network.target

          [Service]
          Type=simple
          User=appuser
          WorkingDirectory={{ app_dir }}
          ExecStart=/usr/bin/node {{ app_dir }}/server.js
          Restart=always
          RestartSec=5
          Environment=NODE_ENV=production
          Environment=PORT={{ app_port }}
          Environment=HOST=127.0.0.1

          [Install]
          WantedBy=multi-user.target
      notify: Restart app

    - name: Enable and start app service
      ansible.builtin.systemd:
        name: tic-tac-toe
        enabled: true
        state: started
        daemon_reload: true

    # ── Nginx config ───────────────────────────────────────────────────────────
    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Write nginx vhost config
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/tic-tac-toe
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              client_max_body_size 10M;
              gzip on;
              gzip_types text/plain text/css application/javascript application/json;

              location / {
                  proxy_pass         http://127.0.0.1:{{ app_port }};
                  proxy_http_version 1.1;
                  proxy_set_header   Host              $host;
                  proxy_set_header   X-Real-IP         $remote_addr;
                  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                  proxy_set_header   X-Forwarded-Proto $scheme;
                  proxy_set_header   Upgrade           $http_upgrade;
                  proxy_set_header   Connection        keep-alive;
                  proxy_cache_bypass $http_upgrade;
              }
          }
      notify: Reload nginx

    - name: Enable nginx vhost
      ansible.builtin.file:
        src: /etc/nginx/sites-available/tic-tac-toe
        dest: /etc/nginx/sites-enabled/tic-tac-toe
        state: link
      notify: Reload nginx

    - name: Test nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Flush handlers before health check
      ansible.builtin.meta: flush_handlers

    # ── Wait for app to be healthy ─────────────────────────────────────────────
    - name: Wait for app to be listening on port {{ app_port }}
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ app_port }}"
        timeout: 60

  handlers:
    - name: Restart app
      ansible.builtin.systemd:
        name: tic-tac-toe
        state: restarted
        daemon_reload: true

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
